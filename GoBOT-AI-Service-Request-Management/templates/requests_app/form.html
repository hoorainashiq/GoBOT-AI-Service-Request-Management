{% extends "base.html" %}
{% block title %}New request{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Submit a service request</h1>
  <p class="muted">Describe your issue. GoBOT will automatically suggest a category and priority.</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Submit</button>
    <a href="{% url 'requests_app:list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
